<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elegant Markdown to PDF</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="ui.css">
    <!-- CodeMirror for Syntax Highlighting -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/markdown/markdown.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/css/css.min.js"></script>
    
    <!-- KaTeX for Math -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    
    <!-- Mermaid for Diagrams -->
    <script src="https://cdn.jsdelivr.net/npm/mermaid@10.2.4/dist/mermaid.min.js"></script>
</head>
<body>
    <header class="app-header">
        <div class="header-left">
            <div class="logo">🚀 Elegant MD-to-PDF</div>
        </div>
        
        <div class="header-center">
            <div id="status-message" class="status-pill">Ready</div>
        </div>

        <div class="header-right">
            <a href="https://github.com/Benedict-CS/Markdown-to-PDF" target="_blank" class="github-link">
                <svg height="18" viewBox="0 0 16 16" width="18"><path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"></path></svg>
                GitHub
            </a>
            <div class="actions">
                <button id="preview-btn" class="btn-secondary">Update Preview</button>
                <button id="convert-btn" class="btn-primary">Download PDF</button>
            </div>
        </div>
    </header>

    <main class="app-container">
        <section class="editor-panel">
            <div class="panel-header">
                <span>Markdown Editor</span>
                <div class="editor-toolbar">
                    <input type="file" id="file-upload" accept=".md" style="display: none;">
                    <button id="upload-btn" title="Upload .md File">📂 Upload</button>
                    <button id="download-md-btn" title="Export .md File">💾 Export</button>
                    <button id="load-example-btn" title="Restore Example Content">📝 Sample</button>
                    <button id="clear-editor-btn" class="btn-text-danger" title="Clear Editor">🗑️ Clear</button>
                </div>
            </div>
            <textarea id="markdown-input"></textarea>
        </section>

        <section class="preview-panel">
            <div class="panel-header">
                <div class="header-title-group">
                    Live Preview
                    <span id="loading-spinner" class="spinner" style="display: none;"></span>
                </div>
                <div class="preview-controls">
                    <button class="zoom-btn" data-size="fit" title="Fit to Container">Fit</button>
                    <button class="zoom-btn" data-size="75">75%</button>
                    <button class="zoom-btn active" data-size="100">100%</button>
                </div>
            </div>
            <div id="preview-container">
                <div class="preview-placeholder">Click "Update Preview" or enable Auto-Update</div>
                <iframe id="pdf-preview" style="display: none;"></iframe>
            </div>
        </section>

        <section class="controls-panel">
            <div class="panel-header">Settings</div>
            <div class="settings-content">
                <div class="section-title" style="margin-top: 0;">💡 Pro Tips</div>
                <div class="tips-box">
                    <p><strong>Styling:</strong> Use <code>&lt;style&gt;</code> tags for custom CSS.</p>
                    <p><strong>Math:</strong> Use <code>$$ E=mc^2 $$</code></p>
                    <p><strong>Diagrams:</strong> Use <code>```mermaid</code> blocks.</p>
                </div>

                <div class="section-title">📂 Document Library</div>
                <div class="doc-list-container">
                    <select id="doc-selector">
                        <option value="current">Primary Draft</option>
                    </select>
                    <div class="doc-actions">
                        <button id="rename-doc-btn" class="btn-secondary" title="Rename Document">✏️</button>
                        <button id="delete-doc-btn" class="btn-secondary btn-text-danger" title="Delete Document">🗑️</button>
                        <button id="new-doc-btn" class="btn-secondary" title="New Document">+</button>
                    </div>
                </div>

                <div class="section-title">✨ Live Preview</div>
                <div class="control-group checkbox">
                    <input type="checkbox" id="auto-update" checked>
                    <label for="auto-update">Auto-Update Preview</label>
                </div>
                <div class="control-group">
                    <label>Update Delay</label>
                    <select id="update-delay">
                        <option value="500">0.5s (Instant)</option>
                        <option value="1000" selected>1s (Fast)</option>
                        <option value="2000">2s (Balanced)</option>
                        <option value="5000">5s (Stable)</option>
                    </select>
                </div>

                <div class="section-title">📄 Header & Footer</div>
                
                <div class="control-group checkbox">
                    <input type="checkbox" id="show-header">
                    <label for="show-header">Show Header</label>
                </div>
                <div class="control-group">
                    <input type="text" id="header-title" placeholder="Header Title" value="How to use markdown">
                </div>

                <div class="control-group checkbox">
                    <input type="checkbox" id="show-page-numbers" checked>
                    <label for="show-page-numbers">Show Page Numbers</label>
                </div>
                <div class="control-group">
                    <select id="page-format-style">
                        <option value="simple" selected>Simple (1)</option>
                        <option value="page_of">Page of (Page 1 of 5)</option>
                        <option value="slash">Slash (1 / 5)</option>
                    </select>
                </div>

                <div class="control-group checkbox">
                    <input type="checkbox" id="show-copyright" checked>
                    <label for="show-copyright">Show Copyright</label>
                </div>
                <div class="control-group">
                    <input type="text" id="copyright-text" value="© 2026 All Rights Reserved">
                </div>

                <div class="section-title">📏 Pagination</div>
                <div class="control-group checkbox">
                    <input type="checkbox" id="auto-page-break" checked>
                    <label for="auto-page-break">Enable Auto Break</label>
                </div>
                <div class="sub-controls">
                    <div class="control-group checkbox">
                        <input type="checkbox" id="break-h1">
                        <label for="break-h1">Break before H1</label>
                    </div>
                    <div class="control-group checkbox">
                        <input type="checkbox" id="break-h2">
                        <label for="break-h2">Break before H2</label>
                    </div>
                    <div class="control-group checkbox">
                        <input type="checkbox" id="break-h3">
                        <label for="break-h3">Break before H3</label>
                    </div>
                </div>

                <div class="control-group" style="margin-top: 1rem;">
                    <label>Page Format</label>
                    <select id="page-format">
                        <option value="A4" selected>A4 Paper</option>
                        <option value="Letter">US Letter</option>
                        <option value="Legal">Legal</option>
                    </select>
                </div>
            </div>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
